version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: foodbridge_db
    environment:
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: foodbridge
      POSTGRES_DB: foodbridge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodbridge']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: foodbridge_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://foodbridge:foodbridge@db:5432/foodbridge?schema=public
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: change_me_in_production
      JWT_REFRESH_SECRET: change_me_refresh_in_production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - '5000:5000'
    command: sh -c "npx prisma migrate deploy && node src/server.js"

volumes:
  pgdata:
